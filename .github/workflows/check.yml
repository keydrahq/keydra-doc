name: Check

# Every pull request, and every push to main. The documentation is generated from the
# Keydra source tree, so both repositories are checked out: one for the content, one for
# the facts the reference tables are read from.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Where the workflow puts the Keydra checkout, and where the build looks for it.
  KEYDRA_SOURCE: ${{ github.workspace }}/keydra

jobs:
  check:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation
        uses: actions/checkout@v7
        with:
          path: docs
          # `git describe` is read for the version the build reports.
          fetch-depth: 0

      # Keydra is three repositories now, and the build reads two of them: the backend for
      # the endpoint, permission and configuration tables, the frontend for every interface
      # label a procedure quotes. They are checked out into one directory under the names
      # scripts/lib/paths.ts expects, which is the same shape a developer with all three
      # cloned side by side already has.
      - name: Check out the Keydra backend
        uses: actions/checkout@v7
        with:
          repository: keydrahq/keydra-backend
          path: keydra/keydra-backend
          # Only the sources the inventory reads are needed, and none of the history.
          fetch-depth: 1
          # A private application repository needs a token with read access to it. Add
          # KEYDRA_SOURCE_TOKEN as a repository secret; a public repository needs nothing
          # and the empty value is ignored.
          token: ${{ secrets.KEYDRA_SOURCE_TOKEN || github.token }}

      - name: Check out the Keydra frontend
        uses: actions/checkout@v7
        with:
          repository: keydrahq/keydra-frontend
          path: keydra/keydra-frontend
          fetch-depth: 1
          token: ${{ secrets.KEYDRA_SOURCE_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: docs/.nvmrc
          cache: yarn
          cache-dependency-path: docs/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        working-directory: docs
        run: yarn install --immutable

      - name: Read the Keydra source tree
        working-directory: docs
        run: yarn inventory

      - name: Test
        working-directory: docs
        run: yarn test

      # Both languages build in one job on purpose: the parity and interface-label checks
      # compare them against each other and against the Keydra locales, so all three have
      # to be present at once.
      - name: Build
        working-directory: docs
        run: yarn build

      - name: Validate
        working-directory: docs
        run: yarn validate

      - name: Style
        working-directory: docs
        run: yarn lint

      - name: Keep the built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs/dist
          retention-days: 7

  pdf:
    name: PDF
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
        with:
          path: docs
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: keydrahq/keydra-backend
          path: keydra/keydra-backend
          fetch-depth: 1
          token: ${{ secrets.KEYDRA_SOURCE_TOKEN || github.token }}
      - uses: actions/checkout@v7
        with:
          repository: keydrahq/keydra-frontend
          path: keydra/keydra-frontend
          fetch-depth: 1
          token: ${{ secrets.KEYDRA_SOURCE_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: docs/.nvmrc
          cache: yarn
          cache-dependency-path: docs/yarn.lock
      - run: corepack enable
      - name: Install
        working-directory: docs
        run: yarn install --immutable
      - name: Install Chromium
        working-directory: docs
        run: yarn playwright install --with-deps chromium
      - name: Build
        working-directory: docs
        run: yarn build
      - name: PDF
        working-directory: docs
        run: yarn pdf
      - uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: docs/pdf/*.pdf
          retention-days: 30
