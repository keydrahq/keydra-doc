name: Publish to GitHub Pages

# Publishing is deliberately separate from checking and runs only on the default branch.
# A pull request — especially one from a fork — is validated by check.yml and can publish
# nothing: it never holds the `pages: write` permission this workflow needs.
#
# Two things make this build different from a local one:
#
#   --base-path     GitHub Pages serves a project site under /<repo>/, and every URL,
#                   asset and redirect this site emits is derived from that path. It is
#                   read from the Pages configuration rather than assumed, so renaming
#                   the repository does not silently break every link.
#
# The prefix is left alone. It was emptied when this repository was called `docs` and the
# base path supplied that segment on its own; the repository is called keydra-doc now, so
# the base path supplies `keydra-doc` and the `docs` segment has to come from site.yml
# again — which is also the shape the real site has, so a manual run previews the thing
# rather than something adjacent to it.

# By hand only, and that is the point rather than an omission.
#
# The published manual comes from keydrahq/keydra, which is the one place all three
# repositories are checked out together at commits known to work with each other — the same
# reason the image is built there. It serves this site under /docs, beneath a landing page.
#
# So this workflow no longer runs on a push: two addresses for the same manual means two
# things to keep in step, and the one nobody watches is the one that goes stale while still
# answering. It is kept because a run of it is the only way to see this repository's own
# work on a real Pages deployment without a commit to another repository — which needs Pages
# enabled here, and is why a push to main was failing with "Get Pages site failed".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-way: an interrupted deploy leaves
# the site partly replaced.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  KEYDRA_SOURCE: ${{ github.workspace }}/keydra

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation
        uses: actions/checkout@v7
        with:
          path: docs
          fetch-depth: 0

      - name: Check out Keydra
        uses: actions/checkout@v7
        with:
          repository: keydrahq/keydra-backend
          path: keydra/keydra-backend
          fetch-depth: 1
          token: ${{ secrets.KEYDRA_SOURCE_TOKEN || github.token }}

      - name: Check out the Keydra frontend
        uses: actions/checkout@v7
        with:
          repository: keydrahq/keydra-frontend
          path: keydra/keydra-frontend
          fetch-depth: 1
          token: ${{ secrets.KEYDRA_SOURCE_TOKEN || github.token }}

      # Two setup-node calls, and corepack between them, which is the documented way round a
      # real ordering problem rather than belt and braces. `cache: yarn` makes the action run
      # `yarn cache dir` to find what to cache, and the yarn on a fresh runner is 1.22 — which
      # refuses to run at all for a project whose packageManager field says 4.x, so the step
      # fails before anything is installed. Enabling corepack first needs a Node to enable it
      # against, and enabling it before any setup-node leaves its shims pointing at the Node
      # setup-node is about to replace. Hence: install Node, enable corepack, ask for the cache.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: docs/.nvmrc

      - run: corepack enable

      - name: Cache the Yarn store
        uses: actions/setup-node@v7
        with:
          node-version-file: docs/.nvmrc
          cache: yarn
          cache-dependency-path: docs/yarn.lock

      - name: Install
        working-directory: docs
        run: yarn install --immutable

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        working-directory: docs
        run: |
          yarn build \
            --base-path "${{ steps.pages.outputs.base_path }}/" \
            --base-url "${{ steps.pages.outputs.origin }}"

      # The same gate the pull request passed, run against the artefact that is about to
      # be published. A base path is the one thing a local build cannot verify.
      - name: Validate
        working-directory: docs
        run: yarn validate

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
