# The documentation's shape.
#
# One file rather than one per language, deliberately. §178 of the specification asks that
# the English and Turkish navigations represent an equivalent hierarchy with equivalent
# page identity; a shared structure guarantees that by construction, where two files plus a
# parity check only detects a divergence after somebody has written one.
#
# What differs by language is the wording, and it lives where wording lives: a group's
# label is `nav.group.<id>` in `locales/<lang>.yml`, and a page's label is that page's own
# AsciiDoc title, so a navigation entry cannot disagree with the heading it leads to.
#
#   id    stable and language-neutral — this is what the language switcher maps on
#   slug  the URL segment, also language-neutral, so /docs/en/... and /docs/tr/... align
#   page  the assembly under content/<lang>/assemblies/, without the extension

