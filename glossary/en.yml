# The translation glossary, from the English side.
#
# `keep: true` means the term is not translated in any language: product names,
# standards, and code identifiers. The rest have a decided Turkish equivalent, and
# .vale/styles/KeydraTR/Terimler.yml enforces it.
#
# Interface labels are not this file's business: a procedure quotes whatever label the
# interface shows in that language.

terms:
- term: Keydra
  translation: Keydra
  keep: true
  note: The product name. A proper noun in every language; never translated, never lower-cased mid-sentence.
- term: Redis
  translation: Redis
  keep: true
  note: Ürün adı; çevrilmez.
- term: Valkey
  translation: Valkey
  keep: true
  note: Ürün adı; çevrilmez.
- term: Quarkus
  translation: Quarkus
  keep: true
  note: Ürün adı; çevrilmez.
- term: PatternFly
  translation: PatternFly
  keep: true
  note: Ürün adı; çevrilmez.
- term: PostgreSQL
  translation: PostgreSQL
  keep: true
  note: Ürün adı; çevrilmez. "Postgres" yazılmaz.
- term: ClickHouse
  translation: ClickHouse
  keep: true
  note: Ürün adı; çevrilmez.
- term: Prometheus
  translation: Prometheus
  keep: true
  note: Ürün adı; çevrilmez.
