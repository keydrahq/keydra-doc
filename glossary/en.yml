  translation: Keycloak
  keep: true
  note: Ürün adı; çevrilmez.
- term: Podman
  translation: Podman
  keep: true
  note: Ürün adı; çevrilmez.
- term: OIDC
  translation: OIDC
  keep: true
  note: Kısaltma korunur. İlk geçtiğinde "OpenID Connect" açılabilir.
- term: OpenID Connect
  translation: OpenID Connect
  keep: true
  note: Standardın adı; çevrilmez.
- term: OAuth 2
  translation: OAuth 2
  keep: true
  note: Standardın adı; çevrilmez.
- term: API
  translation: API
  keep: true
  note: Kısaltma korunur.
- term: REST
  translation: REST
  keep: true
  note: Kısaltma korunur.
- term: GraphQL
  translation: GraphQL
  keep: true
  note: Ürün adı; çevrilmez.
- term: WebSocket
  translation: WebSocket
  keep: true
  note: Teknoloji adı; çevrilmez.
- term: endpoint
  translation: uç nokta
  keep: false
  note: Bir HTTP adresi anlamında. Kod içindeki `endpoint` tanımlayıcıları çevrilmez.
- term: instance
  translation: örnek
  keep: false
  note: Çalışan bir Keydra süreci. Bir sunucu değil, bir kurulum kopyası.
- term: cluster
  translation: küme
  keep: false
  note: Redis/Valkey kümesi. Arayüzde "Küme" olarak geçer.
- term: node
  translation: düğüm
  keep: false
  note: Küme düğümü.
- term: connection
  translation: bağlantı
  keep: false
  note: Arayüzde "Bağlantılar" sayfası.
- term: connection profile
  translation: bağlantı profili
  keep: false
  note: Bir hedefin Keydra’daki tanımı.
- term: target
  translation: hedef
  keep: false
  note: Keydra’nın yönettiği Redis/Valkey sunucusu. Arayüzde "Hedef".
- term: backup
  translation: yedek
  keep: false
  note: İşlem olarak "yedekleme", nesne olarak "yedek".
- term: restore
  translation: geri yükleme
  keep: false
  note: Arayüzde "Geri yükle".
- term: migration
  translation: göç
  keep: false
  note: Anahtarların iki hedef arasında taşınması. Arayüzde "Göçler".
- term: credential
  translation: kimlik bilgisi
  keep: false
