- term: secret
  translation: sır
  keep: false
  note: Şifreli saklanan ve API tarafından döndürülmeyen değer.
- term: token
  translation: belirteç
  keep: false
  note: Ortam değişkeni ve alan adları (`token`) çevrilmez.
- term: role
  translation: rol
  keep: false
  note: Yerleşik rol adları (`viewer`, `operator`, `admin`) çevrilmez.
- term: permission
  translation: izin
  keep: false
  note: İzin kimlikleri (`keys:read`) çevrilmez.
- term: grant
  translation: yetki
  keep: false
  note: '"Bir özne bir kapsamda bir rol tutar" cümlesindeki bağ.'
- term: scope
  translation: kapsam
