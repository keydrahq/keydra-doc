# The whole of nginx's configuration, rather than a fragment dropped into somebody else's.
#
# The image this replaced was Red Hat's s2i nginx, which is built to compile an application
# inside the container and therefore carries gdb, vim, rsync, python3 and the Perl stack —
# 252 packages against 136, for an image whose entire job is to serve files that were built
# in the stage above. What that costs is this file; what it buys is that none of those five
# is in the published image.

worker_processes auto;
# Logs to the container's streams, because a file inside a container is a log nobody reads.
error_log /dev/stderr warn;
# Not /run: an arbitrary uid — which is what OpenShift assigns — cannot write there, and the
# failure is a container that exits before it has said anything useful.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /opt/keydra/html;

        # Two kinds of file are served and they want opposite policies. An asset carries a
        # content hash in its name, so it can be cached forever — a change produces a
        # different name. A page does not, so it must be revalidated, or a reader keeps
        # yesterday's documentation until they clear their cache.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Pages: always revalidate. Cheap, because a 304 carries no body.
        location ~* \.html$ {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # A search index changes with the content it indexes, so it follows the pages.
        location ~* search-index\.json$ {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # Clean URLs: /docs/en/0.1/getting-started/ is a directory holding index.html.
        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }

        error_page 404 /404.html;

        # Nothing on this site is framed, typed by guesswork, or a referrer worth leaking.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
