# Cache rules for the documentation.
#
# Two kinds of file are served and they want opposite policies. An asset carries a content
# hash in its name, so it can be cached forever — a change produces a different name.
# A page does not, so it must be revalidated, or a reader keeps yesterday's documentation
# until they clear their cache.

# Fingerprinted assets: immutable for a year.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Pages: always revalidate. Cheap, because a 304 carries no body.
location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

# A search index changes with the content it indexes, so it follows the pages.
location ~* search-index\.json$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

# Clean URLs: /docs/en/0.1/getting-started/ is a directory holding index.html.
location / {
    try_files $uri $uri/ $uri/index.html =404;
}

# Nothing on this site is framed, typed by guesswork, or a referrer worth leaking.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
