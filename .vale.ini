# Vale, split by what it is actually checking.
#
# Three things are being validated and they are not the same thing: AsciiDoc structure,
# which is language-neutral; Red Hat's English style rules; and this project's own
# terminology, which has a Turkish half. Running English grammar rules over Turkish prose
# produces a page of failures that mean nothing, so the Turkish content gets its own set.
#
# `make docs-lint` downloads Vale and its packages the first time it runs.

StylesPath = .vale/styles
# Everything is reported. What *fails* is errors only: `make docs-lint` passes
# `--minAlertLevel=error`, so a warning is information and an error is a gate.
MinAlertLevel = suggestion

Packages = RedHat, AsciiDoc

Vocab = Keydra

# --- English -----------------------------------------------------------------
[content/en/**/*.adoc]
BasedOnStyles = Vale, RedHat, AsciiDoc, Keydra

# The Red Hat style guide asks for these and the project agrees; they are named here so a
# change is visible rather than inherited.
RedHat.CaseSensitiveTerms = YES
RedHat.PassiveVoice = suggestion
RedHat.Spelling = error

# Product and technology names Red Hat's dictionary does not carry.
Vale.Terms = NO

# Off, for two reasons and both of them are reasons rather than convenience.
#
# The rule's `suggest` action loads a Tengo script from the package, and the RedHat package
# and Vale 3.14 disagree about where that path is resolved from — the rule stops the whole
# run with "script 'actions/NoGerundsInTitles.tengo' not found" before anything is checked.
#
# It is also the wrong rule for this documentation. Red Hat's own modular documentation
# standard titles a procedure module with a gerund — "Creating a user" — which is exactly
# what every proc_ module here does. Re-enable it if the packaging is fixed and this
# documentation stops being modular.
RedHat.NoGerundsInTitles = NO

# Reported, and deliberately not fixed. Red Hat's guide asks for a comma, a colon or
# parentheses instead of an em dash, and this documentation uses the em dash the way the
# Keydra source comments it is derived from do: to attach the reason to the statement it
# explains. Mechanically replacing 148 of them would damage the sentences, and each one is
# a judgement rather than a substitution. Kept as a warning so the count stays visible;
# `make docs-lint` gates on errors, so it does not fail a build.
RedHat.EmDash = warning

# "may" carries a permission meaning throughout the access-control pages — "who may do
# what" is the model's own phrasing — and Red Hat's suggestion to prefer "can" would flatten
# a distinction the product makes. Reported rather than enforced.
RedHat.TermsWarnings = warning

# --- Turkish -----------------------------------------------------------------
# AsciiDoc structure applies to every language. The English prose rules do not: they would
# flag every Turkish sentence for a grammar they are not describing.
[content/tr/**/*.adoc]
BasedOnStyles = AsciiDoc, KeydraTR

# --- Neither ------------------------------------------------------------------
# Generated tables are derived from the source tree and are not written by anybody, so
# style rules about them are rules about the code they came from.
[content/*/snippets/generated/**]
BasedOnStyles =
