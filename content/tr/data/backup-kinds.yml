LOCAL: Keydra’nın çalıştığı makinedeki bir dizin; bağlı bir paylaşıma da bu yolla erişilir. Kullanışlı,
  ama o makinenin yok olmasına karşı hiçbir koruma sağlamaz.
S3: 'S3 ve onun API’sini konuşan her şey: MinIO, Cloudflare R2, DigitalOcean Spaces.'
AZURE_BLOB: Azure depolama hesabındaki bir kapsayıcı.
GCS: Google Cloud’daki bir kova.
SFTP: SSH üzerinden; parola ya da özel anahtarla.
FTP: Düz FTP ya da sunucu sunuyorsa FTPS.
CUSTOM: 'Uç nokta adresiyle erişilebilen her yer: mesaj kuyruğu, HTTP uç noktası, posta sunucusu, başka
  bir depolama servisi. Yalnızca yazma içindir; buraya yedek gönderilir ama listelenemez, geri yüklenemez
  ve budanamaz.'
